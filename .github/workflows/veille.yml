name: Mise à jour de la veille
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/maj_veille.py
      - run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add portfolio/portfolio/veille/actus.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique de la veille"
          git push
